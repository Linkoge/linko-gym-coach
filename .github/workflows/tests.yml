name: Stage 1 checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - run: uv sync --locked
      - run: uv run python -m scripts.download_model
      - run: uv run ruff check app scripts tests
      - run: uv run ruff format --check app scripts tests
      - run: uv run pytest -q
